name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  wasmtime-component-host:
    name: native Wasmtime Component host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked native micro-TCB
        working-directory: native/wasmtime-component-host
        run: cargo build --locked

  cljc-contract:
    name: CLJC contract gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Component host for integration test
        working-directory: native/wasmtime-component-host
        run: cargo build --locked
      - name: Install pinned independent jco Component host
        run: |
          npm ci --no-audit --no-fund
          chmod +x native/jco-component-host.mjs
      - name: Install wasm-tools
        # kototama.tender-test shells out to `wasm-tools parse` to assemble
        # its WAT fixtures into real Wasm bytes (Chicory Parser/Instance
        # linkage, not mocked) -- pinned version, prebuilt binary release,
        # not `cargo install` (would need the whole Rust toolchain just for
        # one static binary).
        run: |
          curl -sSL -o wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.243.0/wasm-tools-1.243.0-x86_64-linux.tar.gz
          tar xzf wasm-tools.tar.gz
          sudo mv wasm-tools-1.243.0-x86_64-linux/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version
      - name: Install pinned Wasmtime CLI for runtime conformance
        run: |
          curl -sSL -o wasmtime.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v42.0.1/wasmtime-v42.0.1-x86_64-linux.tar.xz
          tar xJf wasmtime.tar.xz
          sudo mv wasmtime-v42.0.1-x86_64-linux/wasmtime /usr/local/bin/wasmtime
          wasmtime --version
      - name: Verify shared security adoption
        run: clojure -M -m kotoba.security.adoption
      - name: Checkout workspace siblings for the :test alias
        # The :test alias pins these as :local/root "../<name>" (workspace
        # dev deps -- see deps.edn's comment on why local/root, not git,
        # for the test profile). Hosted CI has no workspace, so clone the
        # eight direct siblings depth-1 at ../ before `clojure -M:test`.
        # Each is self-contained (its base :deps are git-pinned; the
        # local/root paths inside them live only in their own :dev aliases),
        # so no further cascade is needed.
        run: |
          for repo in kotoba compiler kotoba-lang kotoba-core-contracts \
                      kotoba-selfhost-contracts org-chainagnostic-cacao datom org-w3-did; do
            git clone "https://github.com/kotoba-lang/$repo.git" "../$repo"
          done
          # Pin the compiler change that emits effectful source as a real
          # named-import Component. Update to its squash commit after merge.
          git -C ../compiler fetch origin main
          git -C ../compiler checkout --detach 4e4056e35b1118ced1f92144ccb891e0c12eb075
      - name: Test CLJC contract
        env:
          KOTOTAMA_COMPONENT_HOST: ${{ github.workspace }}/native/wasmtime-component-host/target/debug/kototama-wasmtime-component-host
          KOTOTAMA_JCO_COMPONENT_HOST: ${{ github.workspace }}/native/jco-component-host.mjs
        run: clojure -M:test
      - name: Lint CLJC contract
        run: clojure -M:lint
      - name: Component-authority packaging static check
        run: bash deploy/validate-packaging.sh

  web:
    name: browser WASM AOT demo gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f
        with:
          version: "1.243.0"
      - run: node web/verify.mjs
      - name: Real workerd Core-Wasm provider E2E
        run: |
          npm ci
          npm run test:workerd
      - name: Compile the same portable Component boundary for Chromium
        run: |
          git clone https://github.com/kotoba-lang/compiler.git ../compiler
          git -C ../compiler fetch origin main
          git -C ../compiler checkout --detach 4e4056e35b1118ced1f92144ccb891e0c12eb075
          (
            cd ../compiler
            clojure -M -m kotoba.compiler.cli compile \
              "$GITHUB_WORKSPACE/qualification/browser-component.kotoba" \
              --target component \
              --output "$GITHUB_WORKSPACE/web/browser.component.wasm"
          )
          npx jco transpile web/browser.component.wasm \
            -o web/generated --name component --no-typescript --quiet
      - run: node web/verify-kgraph.mjs
      - run: node web/verify-actor-host.mjs
      - run: node web/verify-host-free.mjs
      - name: Verify restricted Kotoba Script host
        run: node web/verify-kotoba-script.mjs
      - name: Verify isolated Kotoba Script worker host
        run: node web/verify-kotoba-script-worker.mjs
      - name: Browser security E2E
        run: |
          python3 -m http.server 4173 --directory web >/tmp/kototama-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            result=$(google-chrome --headless --disable-gpu --no-sandbox \
              --virtual-time-budget=35000 --dump-dom \
              http://127.0.0.1:4173/verify-kotoba-script-browser.html) && break
            sleep 1
          done
          echo "$result" | grep 'PASS:42,digest-rejected,timeout-terminated'
      - name: Chromium jco-transpiled Component surface
        run: |
          python3 -m http.server 4173 --directory web >/tmp/kototama-component-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          result=$(google-chrome --headless --disable-gpu --no-sandbox \
            --virtual-time-budget=15000 --dump-dom \
            http://127.0.0.1:4173/verify-component-browser.html)
          echo "$result" | grep 'PASS:compiler-component-jco-chromium:42'
